<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>83 Viagens</title>
    <link rel="stylesheet" href="estilo-cards.css">
    <style>
        /* Importando a fonte Montserrat */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Ativa o deslizamento suave na página inteira */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff; 
            color: #333;
        }

        /* --- PRIMEIRA TELA (HERO) --- */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative; /* Necessário para posicionar o botão animado no fundo */
            
            /* Fundo com imagem e película azul */
            background-image: linear-gradient(rgba(0, 74, 173, 0.2), rgba(0, 74, 173, 0.2)), url('imagens/fundo.jpeg');
            background-color: #004aad;
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            color: #ffffff;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .main-content h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .main-content h2 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .btn {
            background-color: #ffffff;
            color: #004aad;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }

        /* --- ESTILO DO BOTÃO SUSPENSO (SCROLL DOWN) --- */
        .scroll-down-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .scroll-down-btn:hover {
            opacity: 1;
        }

        .scroll-down-btn::after {
            content: '↓';
            font-size: 1.5rem;
            margin-top: 5px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* --- SEÇÃO DE PACOTES --- */
        .packages-section {
            padding: 80px 20px;
            text-align: center;
            background-color: #ffffff;
        }

        .packages-section h2 {
            font-size: 2.5rem;
            color: #004aad;
            margin-bottom: 50px;
            font-weight: 700;
        }

        /* O estilo dos cards (.cards-container, .card, .btn-card...)
           agora vive em estilo-cards.css, compartilhado com a pacotes.html */

        /* Botão "Ver todos os pacotes" (link para a página de pesquisa) */
        .btn-ver-todos {
            display: inline-block;
            margin-top: 50px;
            background-color: transparent;
            color: #004aad;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border: 2px solid #004aad;
            border-radius: 50px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-ver-todos:hover {
            background-color: #004aad;
            color: #ffffff;
        }

        /* --- RODAPÉ --- */
        .footer {
            padding: 20px;
            text-align: center;
            background-color: #004aad;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 300;
        }
        
        .footer span {
            margin: 0 10px;
        }

        /* Ajustes para celular */
        @media (max-width: 768px) {
            .main-content h1 { font-size: 2.8rem; }
            .main-content h2 { font-size: 1.2rem; margin-bottom: 30px; }
            .footer { font-size: 0.8rem; padding: 15px 10px; }
            .footer span { display: block; margin: 5px 0; }
            .footer .separator { display: none; }
        }
    </style>
</head>
<body>

    <!-- PRIMEIRA TELA -->
    <div class="hero-section">
        <main class="main-content">
            <h1>A SUA VIAGEM COMEÇA AQUI</h1>
            <h2>Atendimento personalizado e 100% humanizado</h2>
            <a href="https://wa.me/5583993162533?text=Olá, vim pelo site. Gostaria de planejar minha próxima viagem" class="btn">Entre em contato</a>
        </main>
        
        <!-- NOVO BOTÃO SUSPENSO -->
        <a href="#pacotes" class="scroll-down-btn">Ver Pacotes</a>
    </div>

    <!-- SEÇÃO DE PACOTES COM A TAG ID="PACOTES" -->
    <section id="pacotes" class="packages-section">
        <h2>Pacotes em Destaque</h2>
        
        <!-- Os cards são gerados automaticamente por render-pacotes.js a partir de pacotes.js -->
        <div class="cards-container"></div>

        <!-- Link para a página de pesquisa, com todos os pacotes e filtros -->
        <a href="pacotes.html" class="btn-ver-todos">Ver todos os pacotes</a>
    </section>

    <!-- RODAPÉ -->
    <footer class="footer">
        <span>83 VIAGENS</span> <span class="separator">|</span>
        <span>CNPJ: 68.609.278/0001-02</span> <span class="separator">|</span>
        <span>(83) 99316-2533</span>
    </footer>

    <!-- PACOTES: dados + renderização dos cards da home -->
    <script src="pacotes.js"></script>
    <script src="render-pacotes.js"></script>
    <script>renderizarCards();</script>
</body>
</html>
